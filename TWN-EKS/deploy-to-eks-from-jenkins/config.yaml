apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: 
    server: https://85038B743F0270FD519E9D1E2804C661.yl4.us-east-1.eks.amazonaws.com 
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: aws
  name: aws
current-context: aws
users:
- name: aws
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: /usr/local/bin/aws-iam-authenticator
      args:
        - "token"
        - "-i"
        - "demo-cluster"
